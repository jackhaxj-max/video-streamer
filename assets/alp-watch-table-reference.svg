<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Watch Table / Clock Test reference figure</title>
  <desc id="desc">Eight directions around a circle. Each direction has a letter in a circle and a number in a square. North is a3, north-east is g4, east is c2, south-east is f3, south is k5, south-west is e5, west is d1, and north-west is m4.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172033; text-anchor: middle; }
      .subtitle { font: 400 21px Arial, Helvetica, sans-serif; fill: #536079; text-anchor: middle; }
      .outer { fill: #fbfdff; stroke: #253b6e; stroke-width: 6; }
      .guide { stroke: #d9e2f2; stroke-width: 3; stroke-dasharray: 10 12; }
      .spoke { stroke: #c9d6eb; stroke-width: 2; }
      .dir-pill { fill: #ffffff; stroke: #b8c8e6; stroke-width: 2; }
      .dir { font: 700 24px Arial, Helvetica, sans-serif; fill: #1b4fa0; text-anchor: middle; dominant-baseline: middle; }
      .center-dot { fill: #172033; stroke: #ffffff; stroke-width: 5; }
      .center-label { font: 700 16px Arial, Helvetica, sans-serif; fill: #172033; text-anchor: middle; }
      .letter-circle { fill: #e8f1ff; stroke: #2671d9; stroke-width: 3; }
      .letter { font: 700 26px Arial, Helvetica, sans-serif; fill: #174a9c; text-anchor: middle; dominant-baseline: central; }
      .number-square { fill: #fff4d6; stroke: #e0a11b; stroke-width: 3; }
      .number { font: 700 28px Arial, Helvetica, sans-serif; fill: #7a4b00; text-anchor: middle; dominant-baseline: central; }
      .pair { font: 700 18px Arial, Helvetica, sans-serif; fill: #536079; text-anchor: middle; }
      .note-bg { fill: #eef4ff; stroke: #bed0ef; stroke-width: 2; }
      .note { font: 700 21px Arial, Helvetica, sans-serif; fill: #1b3f78; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07a1b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="900" rx="28"/>
  <text class="title" x="500" y="54">Watch Table / Clock Test</text>
  <text class="subtitle" x="500" y="88">One reference image for the main concepts</text>

  <!-- Opposite-direction guide lines -->
  <line class="guide" x1="500" y1="130" x2="500" y2="810"/>
  <line class="guide" x1="160" y1="470" x2="840" y2="470"/>
  <line class="guide" x1="309" y1="279" x2="691" y2="661"/>
  <line class="guide" x1="309" y1="661" x2="691" y2="279"/>

  <!-- Main circle -->
  <circle class="outer" cx="500" cy="470" r="340"/>

  <!-- Light spokes from the center -->
  <line class="spoke" x1="500" y1="470" x2="500" y2="180"/>
  <line class="spoke" x1="500" y1="470" x2="691" y2="279"/>
  <line class="spoke" x1="500" y1="470" x2="790" y2="470"/>
  <line class="spoke" x1="500" y1="470" x2="691" y2="661"/>
  <line class="spoke" x1="500" y1="470" x2="500" y2="760"/>
  <line class="spoke" x1="500" y1="470" x2="309" y2="661"/>
  <line class="spoke" x1="500" y1="470" x2="210" y2="470"/>
  <line class="spoke" x1="500" y1="470" x2="309" y2="279"/>

  <!-- Direction labels near the center -->
  <g>
    <rect class="dir-pill" x="466" y="330" width="68" height="42" rx="21"/>
    <text class="dir" x="500" y="352">N</text>

    <rect class="dir-pill" x="537" y="378" width="72" height="42" rx="21"/>
    <text class="dir" x="573" y="400">NE</text>

    <rect class="dir-pill" x="580" y="449" width="68" height="42" rx="21"/>
    <text class="dir" x="614" y="471">E</text>

    <rect class="dir-pill" x="537" y="520" width="72" height="42" rx="21"/>
    <text class="dir" x="573" y="542">SE</text>

    <rect class="dir-pill" x="466" y="568" width="68" height="42" rx="21"/>
    <text class="dir" x="500" y="590">S</text>

    <rect class="dir-pill" x="391" y="520" width="72" height="42" rx="21"/>
    <text class="dir" x="427" y="542">SW</text>

    <rect class="dir-pill" x="352" y="449" width="68" height="42" rx="21"/>
    <text class="dir" x="386" y="471">W</text>

    <rect class="dir-pill" x="391" y="378" width="72" height="42" rx="21"/>
    <text class="dir" x="427" y="400">NW</text>
  </g>

  <!-- Center marker -->
  <circle class="center-dot" cx="500" cy="470" r="13"/>
  <text class="center-label" x="500" y="506">center</text>

  <!-- Component a3 at North -->
  <g transform="translate(500 180)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">a</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">3</text>
    <text class="pair" x="0" y="48">a3</text>
  </g>

  <!-- Component g4 at North-East -->
  <g transform="translate(691 279)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">g</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">4</text>
    <text class="pair" x="0" y="48">g4</text>
  </g>

  <!-- Component c2 at East -->
  <g transform="translate(790 470)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">c</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">2</text>
    <text class="pair" x="0" y="48">c2</text>
  </g>

  <!-- Component f3 at South-East -->
  <g transform="translate(691 661)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">f</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">3</text>
    <text class="pair" x="0" y="48">f3</text>
  </g>

  <!-- Component k5 at South -->
  <g transform="translate(500 760)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">k</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">5</text>
    <text class="pair" x="0" y="48">k5</text>
  </g>

  <!-- Component e5 at South-West -->
  <g transform="translate(309 661)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">e</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">5</text>
    <text class="pair" x="0" y="48">e5</text>
  </g>

  <!-- Component d1 at West -->
  <g transform="translate(210 470)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">d</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">1</text>
    <text class="pair" x="0" y="48">d1</text>
  </g>

  <!-- Component m4 at North-West -->
  <g transform="translate(309 279)">
    <circle class="letter-circle" cx="-36" cy="0" r="24"/>
    <text class="letter" x="-36" y="1">m</text>
    <rect class="number-square" x="12" y="-24" width="48" height="48" rx="8"/>
    <text class="number" x="36" y="1">4</text>
    <text class="pair" x="0" y="48">m4</text>
  </g>

  <!-- Bottom note -->
  <rect class="note-bg" x="210" y="836" width="580" height="44" rx="22"/>
  <text class="note" x="500" y="865">Value = number inside the square. Example: North = a3, so value = 3.</text>
</svg>
